<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>سكرو - لوحة صدارة</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#130c22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Local Tailwind compiler -->
  <script src="./tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            skrew: {
              bg: '#130c22',
              card: '#201633',
              accent: '#7c3aed',
              gold: '#fbbf24',
              silver: '#93c5fd',
              bronze: '#f97316',
            }
          }
        }
      }
    }
  </script>

  <!-- Local styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="h-full select-none flex flex-col font-cairo overflow-x-hidden">

  <!-- Header -->
  <header class="safe-top bg-skrew-bg/80 backdrop-blur-md sticky top-0 z-30 border-b border-white/5 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-2xl select-none">🃏</span>
      <h1 id="app-title" class="text-xl font-black bg-gradient-to-r from-violet-400 to-indigo-300 bg-clip-text text-transparent">
        سكرو - لوحة الصدارة
      </h1>
    </div>
    <button id="lang-toggle" class="btn-active-effect text-xs font-semibold py-1.5 px-3 rounded-full bg-white/10 hover:bg-white/15 text-white transition border border-white/5 cursor-pointer">
      English 🇺🇸
    </button>
  </header>

  <!-- Main Content View Container -->
  <main class="flex-1 overflow-y-auto px-4 py-6 max-w-md mx-auto w-full pb-24">
    
    <!-- ================= SETUP VIEW ================= -->
    <section id="setup-view" class="flex flex-col gap-6 animate-slide-up">
      
      <!-- Logo Banner -->
      <div class="text-center py-4">
        <span class="text-6xl animate-pulse inline-block mb-2 filter drop-shadow-[0_0_15px_rgba(124,58,237,0.4)] select-none">👑</span>
        <h2 id="setup-heading" class="text-lg font-bold text-gray-300">سجل لاعبيك وابدأ التحدي!</h2>
      </div>

      <!-- Collapsible How to Play instructions -->
      <details class="group bg-skrew-card/40 border border-white/5 rounded-2xl overflow-hidden shadow-lg" open>
        <summary class="flex justify-between items-center p-4 font-bold text-gray-200 cursor-pointer list-none select-none bg-skrew-card/80 hover:bg-skrew-card transition">
          <span id="how-to-play-title" class="flex items-center gap-2">كيفية الاستخدام واللعب 📖</span>
          <span class="transition group-open:rotate-180">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-violet-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" />
            </svg>
          </span>
        </summary>
        <div class="p-4 border-t border-white/5 bg-skrew-card/20">
          <ul id="instructions-list" class="flex flex-col gap-3 text-sm text-gray-300 leading-relaxed">
            <!-- Dynamic instructions will insert here -->
          </ul>
        </div>
      </details>

      <!-- Add Player Form -->
      <form id="add-player-form" class="flex gap-2">
        <input type="text" id="player-name-input" maxlength="15" required class="flex-1 py-3.5 px-4 rounded-2xl bg-skrew-card border border-white/10 text-white font-semibold placeholder-gray-500 focus:border-violet-500 focus:ring-2 focus:ring-violet-500/20 outline-none transition shadow-inner text-base" />
        <button type="submit" id="add-player-btn" class="btn-active-effect py-3.5 px-6 rounded-2xl bg-violet-600 hover:bg-violet-500 text-white font-bold transition shadow-lg shadow-violet-600/20 cursor-pointer text-base whitespace-nowrap">
          إضافة لاعب
        </button>
      </form>

      <!-- Added Players List -->
      <div id="players-list" class="flex flex-col gap-3 max-h-[300px] overflow-y-auto pr-1">
        <!-- Players item populated dynamically -->
      </div>

      <!-- Action Button -->
      <div class="mt-4">
        <button id="start-game-btn" disabled class="w-full py-4 px-6 rounded-2xl bg-gray-700 text-gray-400 font-bold text-lg text-center cursor-not-allowed select-none opacity-50">
          بدء اللعب 🎮
        </button>
      </div>
    </section>

    <!-- ================= GAME VIEW ================= -->
    <section id="game-view" class="hidden flex flex-col gap-6 animate-slide-up">
      <!-- Round Info Banner -->
      <div class="bg-gradient-to-br from-skrew-card to-skrew-card/60 border border-white/5 p-5 rounded-3xl shadow-xl flex flex-col gap-2 relative overflow-hidden select-none">
        <div class="absolute -right-10 -bottom-10 text-9xl opacity-[0.03] rotate-12 font-black">SKREW</div>
        <div class="flex items-center justify-between">
          <span id="game-round-num" class="text-xs font-bold text-violet-400 uppercase tracking-widest bg-violet-500/10 px-3 py-1 rounded-full">الجولة 1</span>
          <span id="game-round-name" class="text-lg font-black text-white">عادية 🃏</span>
        </div>
        <p id="game-round-desc" class="text-sm text-gray-300 leading-relaxed mt-1">
          جولة عادية - ركز على حفظ كروتك وتقليل مجموعك.
        </p>
      </div>

      <!-- Round 5 Double/Triple Warning Banner -->
      <div id="game-warning-container" class="hidden">
        <!-- Populated dynamically -->
      </div>

      <!-- Scores inputs list -->
      <div id="game-score-inputs" class="flex flex-col gap-3">
        <!-- Input rows populated dynamically -->
      </div>

      <!-- Actions -->
      <div class="mt-4">
        <button id="submit-scores-btn" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-bold text-lg text-center shadow-lg hover:shadow-violet-600/20 active:scale-[0.98] transition cursor-pointer">
          الجولة التالية ➡️
        </button>
      </div>
    </section>

    <!-- ================= WINNER VIEW ================= -->
    <section id="winner-view" class="hidden flex flex-col gap-6 animate-slide-up">
      
      <!-- Congrats Banner -->
      <div class="bg-gradient-to-b from-amber-500/20 via-transparent to-transparent border border-white/5 p-6 rounded-3xl shadow-xl text-center flex flex-col items-center">
        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-yellow-400 via-amber-500 to-yellow-600 p-0.5 shadow-lg shadow-yellow-500/20 animate-bounce mb-3">
          <div class="w-full h-full rounded-full bg-skrew-bg flex items-center justify-center text-4xl">
            👑
          </div>
        </div>
        <h2 id="winner-congrats" class="text-xl font-extrabold text-amber-400">تهانينا للاعب الفائز! 🎉</h2>
        <p id="winner-is" class="text-sm text-gray-400 mt-1">الفائز هو الكينج 👑</p>
        <h3 id="winner-name" class="text-3xl font-black text-white mt-2 drop-shadow-[0_2px_10px_rgba(255,255,255,0.1)]">أحمد</h3>
        <p id="winner-score" class="text-xl font-bold text-violet-300 mt-1">15 نقطة</p>
      </div>

      <!-- Podium standings list container -->
      <div id="winner-standings">
        <!-- Standings populated dynamically -->
      </div>

      <!-- Table details of rounds breakdown -->
      <div class="bg-skrew-card/60 border border-white/5 rounded-3xl p-4 shadow-xl overflow-hidden">
        <h3 id="winner-history-title" class="font-extrabold text-gray-200 text-base mb-3 flex items-center gap-2 select-none">
          تفاصيل النقاط بالجولات 📋
        </h3>
        <div id="winner-history-table" class="overflow-x-auto rounded-xl border border-white/5">
          <!-- Filled dynamically -->
        </div>
      </div>

      <!-- Actions -->
      <div class="flex flex-col gap-3 mt-4">
        <button id="play-again-btn" class="btn-active-effect w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold text-lg text-center shadow-lg cursor-pointer">
          لعبة جديدة (بنفس اللاعبين) 🔄
        </button>
        
        <div class="flex gap-2">
          <button id="edit-players-btn" class="btn-active-effect flex-1 py-3 px-4 rounded-xl bg-skrew-card hover:bg-gray-800 text-gray-300 font-semibold border border-white/10 text-center transition cursor-pointer">
            تعديل اللاعبين 👥
          </button>
          <button id="reset-all-btn" class="btn-active-effect flex-1 py-3 px-4 rounded-xl bg-red-950/20 hover:bg-red-950/40 text-red-400 font-semibold border border-red-500/10 text-center transition cursor-pointer">
            مسح الكل والبدء من جديد 🧹
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- ================= FLOATING LEADERBOARD BUTTON ================= -->
  <button id="show-leaderboard-btn" class="hidden fixed bottom-6 left-1/2 transform -translate-x-1/2 btn-active-effect z-40 py-3.5 px-6 rounded-full bg-gradient-to-r from-violet-600 via-indigo-600 to-violet-600 text-white font-bold text-sm shadow-xl shadow-violet-600/30 flex items-center gap-2 transition hover:scale-105 active:scale-95 cursor-pointer">
    <span>🏆</span>
    <span>لوحة الصدارة</span>
  </button>

  <!-- ================= LEADERBOARD DRAWER (MODAL) ================= -->
  <div id="leaderboard-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end justify-center">
    <div id="leaderboard-modal-content" class="w-full max-w-md bg-skrew-bg border-t border-white/10 rounded-t-[32px] p-6 max-h-[85vh] flex flex-col transform translate-y-full transition-transform duration-300 select-none">
      
      <!-- Drawer Header Handle bar -->
      <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto mb-4 cursor-pointer" onclick="closeLeaderboard()"></div>

      <div class="flex items-center justify-between pb-3 border-b border-white/5">
        <h2 id="leaderboard-modal-title" class="text-xl font-extrabold text-white flex items-center gap-2">
          لوحة الصدارة 📊
        </h2>
        <button id="close-leaderboard-btn" class="btn-active-effect text-sm font-semibold text-gray-400 hover:text-white p-2 transition cursor-pointer">
          إغلاق
        </button>
      </div>

      <!-- Drawer Standings list scrollable area -->
      <div class="leaderboard-body flex-1 overflow-y-auto pr-1">
        <!-- Content populated dynamically -->
      </div>
    </div>
  </div>

  <!-- Javascript File Linking -->
  <script src="./app.js"></script>
</body>
</html>
